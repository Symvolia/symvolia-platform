  <!-- Head A -->
  <circle cx="258" cy="472" r="5" fill="#a09890" opacity="0.7"/>
  <!-- Head B -->
  <circle cx="242" cy="472" r="5" fill="#908880" opacity="0.65"/>
</svg>
