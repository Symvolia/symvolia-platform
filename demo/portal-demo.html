<!DOCTYPE html>
<html lang="en" data-portal-base="../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symvolia — Portal Transition Demo</title>
  <meta name="theme-color" content="#010101">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #010101;
      color: #d2c8bc;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }
    .intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #010101;
    }
    .intro.is-done {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.1s ease;
    }
    .intro__canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .intro__skip {
      position: absolute;
      right: 1.5rem;
      bottom: 1.5rem;
      background: none;
      border: none;
      color: rgba(210, 200, 188, 0.55);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    html.is-journey-alive .stage { opacity: 1; }
    .stage h1 {
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: clamp(1.2rem, 4vw, 2rem);
      color: #d4af37;
      margin: 0 0 0.6rem;
    }
    .stage p {
      margin: 0;
      opacity: 0.7;
      font-style: italic;
    }
    .hud {
      position: fixed;
      left: 1rem;
      top: 1rem;
      z-index: 20;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.55;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script>document.documentElement.classList.add('is-intro');</script>
</head>
<body>
  <div class="hud" id="hud">Phase —</div>
  <div class="intro" id="intro">
    <canvas class="intro__canvas" id="introCanvas"></canvas>
    <div class="intro__logo" id="introLogo" hidden></div>
    <button type="button" class="intro__skip" id="introSkip">Skip · Enter</button>
  </div>
  <div class="stage" id="stage" aria-label="After portal">
    <div>
      <h1>Symvolia</h1>
      <p>The Echo of your Own Soul</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="../js/portal/portal-audio.js"></script>
  <script>
    window.Symvolia = {
      awaken: function () { document.documentElement.classList.add('is-stage-alive'); },
      showEnterCta: function () {},
      startStageAmbient: function () {},
      isMuted: function () { return false; }
    };
    window.addEventListener('symvolia:portal-phase', function (e) {
      document.getElementById('hud').textContent = 'Phase ' + (e.detail && e.detail.phase);
    });
    window.addEventListener('symvolia:intro-complete', function () {
      document.documentElement.classList.add('is-journey-alive', 'is-journey-cta');
      document.documentElement.classList.remove('is-intro');
      document.getElementById('hud').textContent = 'Ready';
    });
  </script>
  <script type="module">
    import { startPortalTransition } from '../js/portal/portal-transition.js?v=8';
    window.__startPortal = startPortalTransition;
  </script>
</body>
</html>
