<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#010101">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="canonical" href="https://symvolia.github.io/symvolia-platform/">
  <meta name="description" content="Symvolia — shareable link. Responsive on phone and desktop.">
  <title>Symvolia — Share</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/share.css">
</head>
<body class="esoteric-surface share-page">

  <main class="share">
    <a href="index.html" class="share__back">← Symvolia</a>

    <div class="share__inner">
      <p class="share__eyebrow">Adaptable · Phone &amp; Desktop</p>
      <h1 class="share__title">Public Link</h1>
      <p class="share__lead">
        Share the permanent link — always online, on any device.
      </p>

      <div class="share__card share__card--primary">
        <p class="share__label">Permanent · recommended</p>
        <a class="share__url" id="permanentLink" href="https://symvolia.github.io/symvolia-platform/" target="_blank" rel="noopener noreferrer">
          https://symvolia.github.io/symvolia-platform/
        </a>
        <button type="button" class="share__copy" id="copyPermanentBtn">Copy link</button>
      </div>

      <div class="share__card">
        <p class="share__label">Live tunnel</p>
        <a class="share__url" id="publicLink" href="#" target="_blank" rel="noopener noreferrer">
          Loading…
        </a>
        <button type="button" class="share__copy" id="copyBtn" disabled>Copy link</button>
      </div>

      <p class="share__hint" id="copyHint" hidden>Link copied.</p>

      <div class="share__actions">
        <a class="share__open" id="openBtn" href="https://symvolia.github.io/symvolia-platform/" target="_blank" rel="noopener noreferrer">Open permanent site</a>
        <a class="share__open share__open--ghost" href="index.html">Homepage</a>
      </div>
    </div>
  </main>

  <script src="js/share.js?v=2"></script>
</body>
</html>
